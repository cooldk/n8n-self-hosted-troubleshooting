# Scenario C — the configuration that ran cleanly (no banner, manual executions worked).
# Used inside http { upstream n8n { server 127.0.0.1:5690; } ... } on nginx 1.31.3 with n8n 2.41.3, 2026-09-30.
#
# Notes from the run:
# - nginx listened on 8083, so Host carries the port ($host:$server_port). Behind a normal 443/80 listener,
#   "proxy_set_header Host $host;" is the equivalent. Plain $host on a non-standard port drops the port and
#   the browser's Origin no longer matches (see scenario B).
# - This block forwards X-Forwarded-For. With nothing else set, n8n (NODE_ENV=production) logged
#   ERR_ERL_UNEXPECTED_X_FORWARDED_FOR behind it; set N8N_PROXY_HOPS=1 (configs/env/reverse-proxy.env).
# - proxy_http_version 1.1 is only needed on nginx older than 1.29.7 (nginx WebSocket docs).
server {
  listen 8083;
  location / {
    proxy_pass http://n8n;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
}
