# Scenario A — the common copy-paste config: plain HTTP proxy, no Upgrade / Connection headers.
# Used inside http { upstream n8n { server 127.0.0.1:5690; } ... } on nginx 1.31.3 with n8n 2.41.3, 2026-09-30.
#
# What happened: no "Connection lost" banner (the editor never connected, so it stayed in "connecting");
# clicking Execute workflow showed "Problem running workflow / Lost connection to the server";
# the access log showed GET /rest/push answered 401, retried after 1, 2, 4, 8 and 15 s.
server {
  listen 8081;
  location / {
    proxy_pass http://n8n;
    proxy_set_header Host $host:$server_port;
  }
}
