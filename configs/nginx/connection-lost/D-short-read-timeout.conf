# Scenario D — working headers, but an idle read timeout shorter than n8n's 60 s server ping.
# Used inside http { upstream n8n { server 127.0.0.1:5690; } ... } on nginx 1.31.3 with n8n 2.41.3, 2026-09-30.
#
# What happened with proxy_read_timeout 20s: "Connection lost" flashed for about one second roughly every
# 20-30 s (editor state: connected 0.3 s, disconnected 28.8 s, connected 29.8 s, disconnected 49.8 s, ...).
# With the line removed (nginx default 60s) the same connection stayed up for four minutes without a drop,
# so in our test the nginx default was NOT the problem; look for a shorter timeout elsewhere (LB, tunnel, CDN).
server {
  listen 8084;
  location / {
    proxy_pass http://n8n;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host:$server_port;
    proxy_read_timeout 20s;
  }
}
