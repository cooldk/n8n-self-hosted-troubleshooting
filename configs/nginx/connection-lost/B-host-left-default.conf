# Scenario B — WebSocket headers present, but Host left at nginx's default ($proxy_host = the upstream name "n8n").
# Used inside http { upstream n8n { server 127.0.0.1:5690; } ... } on nginx 1.31.3 with n8n 2.41.3, 2026-09-30.
#
# What happened: "Connection lost" stayed in the editor header; with NODE_ENV=production the n8n log repeated
#   warn | Origin header does NOT match the expected origin. (Origin: "http://localhost:8082" -> "localhost:8082",
#          Expected: "n8n" -> "n8n", Protocol: "http")
# Fix that worked on the same instance: either send the public host in Host, or add the commented line below
# (X-Forwarded-Host) and leave Host alone.
server {
  listen 8082;
  location / {
    proxy_pass http://n8n;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # B-fix (tested): proxy_set_header X-Forwarded-Host $host:$server_port;
  }
}
