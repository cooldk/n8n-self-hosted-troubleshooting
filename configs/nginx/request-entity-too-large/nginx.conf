worker_processes 1;
daemon off;
error_log logs/error.log info;
pid logs/nginx.pid;
events { worker_connections 256; }
http {
  access_log logs/access.log;
  client_body_temp_path tmp/body; proxy_temp_path tmp/proxy; fastcgi_temp_path tmp/fcgi; uwsgi_temp_path tmp/uwsgi; scgi_temp_path tmp/scgi;
  upstream n8n { server 127.0.0.1:5711; }

  # E — no client_max_body_size anywhere: nginx's default (1m) applies
  server {
    listen 8091;
    location / {
      proxy_pass http://n8n;
      proxy_set_header Host $host:$server_port;
    }
  }

  # F — limit raised to match N8N_PAYLOAD_SIZE_MAX=32
  server {
    listen 8092;
    client_max_body_size 32m;
    location / {
      proxy_pass http://n8n;
      proxy_set_header Host $host:$server_port;
    }
  }
}
